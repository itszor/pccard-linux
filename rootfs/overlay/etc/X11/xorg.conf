# X on the PC card: the VESA framebuffer (FreeDOS menu option 2, vga=787),
# !PC's keyboard, and !PC's Logitech bus mouse through /dev/input/mice. Set
# out here as there is no udev to find them.

Section "ServerFlags"
	Option	"AutoAddDevices"	"false"
	Option	"AutoEnableDevices"	"false"
EndSection

Section "Device"
	Identifier	"Framebuffer"
	Driver		"fbdev"
	Option		"fbdev"	"/dev/fb0"
EndSection

Section "Screen"
	Identifier	"Screen"
	Device		"Framebuffer"
EndSection

Section "InputDevice"
	Identifier	"Keyboard"
	Driver		"kbd"
	Option		"XkbLayout"	"gb"
EndSection

Section "InputDevice"
	Identifier	"Mouse"
	Driver		"mouse"
	Option		"Device"	"/dev/input/mice"
	Option		"Protocol"	"PS/2"
EndSection

Section "ServerLayout"
	Identifier	"Layout"
	Screen		"Screen"
	InputDevice	"Keyboard"	"CoreKeyboard"
	InputDevice	"Mouse"		"CorePointer"
EndSection
